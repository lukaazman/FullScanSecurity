name: Android APK

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Prepare downloadable APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk FullScanSecurity.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FullScanSecurity-apk
          path: FullScanSecurity.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FullScanSecurity.apk
          generate_release_notes: true
          name: FullScanSecurity ${{ github.ref_name }}
